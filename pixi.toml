[workspace]
name = "slide_slam_noetic"
version = "1.0.0"
description = "ROS 1 Noetic build of SlideSLAM via Pixi and RoboStack"
channels = ["https://repo.prefix.dev/robostack", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.9.*"
cmake = ">=3.20"
c-compiler = "*"
cxx-compiler = "*"
catkin_tools = "*"

# Core ROS 1 Noetic packages
ros-noetic-ros-base = "*"
ros-noetic-roscpp = "*"
ros-noetic-rospy = "*"
ros-noetic-catkin = "*"
ros-noetic-nodelet = "*"
ros-noetic-tf = "*"
ros-noetic-tf2-ros = "*"
ros-noetic-tf2-eigen = "*"
ros-noetic-tf2-geometry-msgs = "*"
ros-noetic-pcl-ros = "*"
ros-noetic-pcl-conversions = "*"
ros-noetic-actionlib = "*"
ros-noetic-actionlib-msgs = "*"
ros-noetic-message-generation = "*"
ros-noetic-message-runtime = "*"
ros-noetic-std-msgs = "*"
ros-noetic-geometry-msgs = "*"
ros-noetic-sensor-msgs = "*"
ros-noetic-nav-msgs = "*"
ros-noetic-visualization-msgs = "*"
ros-noetic-cv-bridge = "*"
ros-noetic-image-transport = "*"

# Core C++ libraries
gtsam = "*"
libopencv = "*"
libgl-devel = "*"
sophus = "*"
eigen = "*"
fmt = "*"
yaml-cpp = "*"
qhull = "*"
qhull-static = "*"

[tasks]
config = "catkin config --init --source-space ."
build-msgs = "catkin build sloam_msgs"
build = { cmd = "catkin build", depends-on = ["build-msgs"] }
clean = "catkin clean -y || rm -rf build devel logs .catkin_tools"
test-place-recognition = { cmd = "bash -c 'roscore & ROS_PID=$!; sleep 2; ../../devel/lib/sloam/sloam_place_recognition_test; kill -9 $ROS_PID 2>/dev/null || true'", cwd = "backend/sloam", depends-on = ["build"] }
test = { depends-on = ["test-place-recognition"] }
