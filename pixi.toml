[workspace]
name = "slide_slam"
version = "1.0.0"
description = "ROS 2 Jazzy build of SlideSLAM via Pixi and RoboStack"
channels = ["https://repo.prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Build system and compilers
cmake = ">=3.24"
ninja = ">=1.11"
c-compiler = ">=2.0"
cxx-compiler = ">=2.0"
colcon-common-extensions = "*"

# Core math, optimization & vision libraries
gtsam = "4.2.*"
eigen = "3.4.*"
libboost-devel = ">=1.85"
suitesparse = "7.*"
tbb-devel = "*"
glog = "*"
qhull = "2020.2.*"
sophus = "1!1.24.*"
fmt = ">=10"
pcl = "*"

# ROS 2 Jazzy core & interfaces
ros-jazzy-ros-base = "*"
ros-jazzy-ament-cmake = "*"
ros-jazzy-rosidl-default-generators = "*"
ros-jazzy-rosidl-default-runtime = "*"
ros-jazzy-rclcpp = "*"
ros-jazzy-rclcpp-components = "*"
ros-jazzy-rclcpp-action = "*"
ros-jazzy-rclpy = "*"
ros-jazzy-std-msgs = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-nav-msgs = "*"
ros-jazzy-builtin-interfaces = "*"
ros-jazzy-action-msgs = "*"

# Perception & Transforms
ros-jazzy-tf2-ros = "*"
ros-jazzy-tf2-eigen = "*"
ros-jazzy-tf2-geometry-msgs = "*"
ros-jazzy-cv-bridge = "*"
ros-jazzy-image-transport = "*"
ros-jazzy-message-filters = "*"
ros-jazzy-pcl-ros = "*"
ros-jazzy-pcl-conversions = "*"
ros-jazzy-sensor-msgs-py = "*"
ros-jazzy-ament-index-cpp = "*"
ros-jazzy-ament-index-python = "*"

# Python runtime and utilities
python = ">=3.10"
numpy = "*"
rosbags = "*"
pytest = "*"
qhull-static = ">=2020.2,<2021"
tmux = "*"
gdown = ">=6.2.0,<7"

[tasks]
check-port = "bash tests/static/check_ros2_port.sh"
build-msgs = "colcon build --packages-select sloam_msgs --symlink-install"
build = { cmd = "colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release", depends-on = ["build-msgs"] }
test = { cmd = "pytest tests/python -v", env = { PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1" } }
test-place-recognition = { cmd = "../../install/sloam/lib/sloam/sloam_place_recognition_test", cwd = "backend/sloam", depends-on = ["build"] }
launch-smoke = { cmd = "bash -c 'source install/setup.bash && bash tests/integration/launch_smoke_test.sh'", depends-on = ["build"] }
download-data = "python tools/gdrive_key.py download https://drive.google.com/drive/folders/0B5oeNvHFA8WDfjVMa29HSldseF81SUxFMTA4d3F6VlN2YW9hdlZ0RzNMM1V3TGdJZmRMb1E?resourcekey=0-E7OTjCMZq2C58dps4Gibqw -O \"${SLIDE_SLAM_BAG_DIR:-/tmp/slide_slam_bags}\""
download-model = "python -m gdown https://drive.google.com/drive/folders/1kQI8mgckA8jAsQJ5Q2qMu-3KzVF5JLqv -O /tmp/slide_slam_bags/model"
convert-bags = "bash tools/convert_ros1_bags.sh"
demo-forest = { cmd = "bash backend/multi_robot_utils_launch/script/tmux_multi_robot_with_bags_forest.sh", depends-on = ["build"] }
demo-parking-lot = { cmd = "bash backend/multi_robot_utils_launch/script/tmux_multi_robot_with_bags_parking_lot.sh", depends-on = ["build"] }
demo-synthetic = { cmd = "bash tools/synth_e2e.sh", depends-on = ["build"] }
demo-indoor = { cmd = "bash backend/multi_robot_utils_launch/script/tmux_single_indoor_robot.sh", depends-on = ["build"] }
demo-outdoor = { cmd = "bash backend/multi_robot_utils_launch/script/tmux_single_outdoor_robot.sh", depends-on = ["build"] }
demo-kitti = { cmd = "bash backend/multi_robot_utils_launch/script/tmux_single_outdoor_kitti.sh", depends-on = ["build"] }
clean = "rm -rf build install log"
